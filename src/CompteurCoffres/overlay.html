<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffres · OBS</title>
<style>
  /* Source navigateur pour OBS : fond transparent, la meme carte que la petite fenetre du compteur. */
  :root {
    --fond: rgba(22, 24, 29, 0.94);
    --bord: #363a42;
    --etiquette: #969ca6;
    --texte: #eceef2;
    --or: #f5b731;
    --trait: #2e3239;
    --vert: #3fb950;
    --orange: #e2a22a;
    --rouge: #f05248;
    --gris: #787e88;
  }
  html, body { margin: 0; background: transparent; }
  body { font: 13px/1.35 "Segoe UI", system-ui, sans-serif; color: var(--texte); padding: 8px; }
  .carte { width: 284px; background: var(--fond); border: 1px solid var(--bord); border-radius: 10px; padding: 14px; box-sizing: border-box; }
  .titre { color: var(--etiquette); font-size: 11px; font-weight: 600; letter-spacing: 0.32em; }
  .gros { display: flex; gap: 18px; margin: 6px 0 10px; }
  .gros > div + div { border-left: 1px solid var(--trait); padding-left: 18px; }
  .nombre { font-size: 34px; font-weight: 600; line-height: 1.1; }
  .or { color: var(--or); }
  .petit { color: var(--etiquette); font-size: 12px; }
  .lignes { border-top: 1px solid var(--trait); padding-top: 8px; display: grid; grid-template-columns: 70px 1fr; row-gap: 3px; }
  .lignes span:nth-child(odd) { color: var(--etiquette); }
  .lignes b { font-weight: 600; }
  .lignes i { font-style: normal; color: var(--etiquette); }
  .statut { margin-top: 8px; color: var(--etiquette); font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .voyant { width: 8px; height: 8px; border-radius: 50%; background: var(--gris); flex: none; }
</style>
</head>
<body>
<div class="carte">
  <div class="titre">COFFRES</div>
  <div class="gros">
    <div><div class="nombre or" id="total">–</div><div class="petit">total</div></div>
    <div><div class="nombre" id="derniere">–</div><div class="petit">dernière partie</div></div>
  </div>
  <div class="lignes" id="lignes"></div>
  <div class="statut"><span class="voyant" id="voyant"></span><span id="statut">Connexion au compteur…</span></div>
</div>
<script>
"use strict";
const nf0 = new Intl.NumberFormat("fr-FR");
const nf = { format: n => nf0.format(n).replace(/ /g, " ") };
const $ = id => document.getElementById(id);
function ligne(nom, fort, suite) {
  const a = document.createElement("span"); a.textContent = nom;
  const b = document.createElement("span");
  const f = document.createElement("b"); f.textContent = fort;
  const s = document.createElement("i"); s.textContent = suite ? "  " + suite : "";
  b.append(f, s);
  return [a, b];
}
async function rafraichir() {
  try {
    const e = await (await fetch("/etat.json", { cache: "no-store" })).json();
    $("total").textContent = nf.format(e.total);
    $("derniere").textContent = e.derniere == null ? "–" : nf.format(e.derniere);
    const l = [];
    l.push(...ligne("Session", e.session.parties ? nf.format(e.session.coffres) + " coffres" : "–",
      e.session.parties ? e.session.parties + " partie" + (e.session.parties > 1 ? "s" : "") : "pas de partie récente"));
    l.push(...ligne("Cassés", nf.format(e.casses.total), nf.format(e.casses.aPied) + " à pied · " + nf.format(e.casses.voiture) + " en voiture"));
    if (e.quete != null) l.push(...ligne("Quête", e.quete >= e.objectif ? nf.format(e.quete) : nf.format(e.quete) + " / " + nf.format(e.objectif), e.quete >= e.objectif ? "terminée ✓" : ""));
    if (e.equipe != null) l.push(...ligne("Escouade", nf.format(e.equipe), e.derniereEquipe != null ? "dernière " + nf.format(e.derniereEquipe) : ""));
    l.push(...(e.boutiqueObtenue ? ligne("Boutique", "obtenue ✓", "accès à la boutique") : ligne("Boutique", e.boutique, "chance cumulée")));
    $("lignes").replaceChildren(...l);
    $("statut").textContent = e.statut;
    $("voyant").style.background = "var(--" + e.voyant + ")";
  } catch {
    $("statut").textContent = "Compteur arrêté ?";
    $("voyant").style.background = "var(--gris)";
  }
}
rafraichir();
setInterval(rafraichir, 3000);
</script>
</body>
</html>
